<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Radar</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: Arial; padding-top: 50px; }
        #radarDisplay { font-size: 60px; color: #ff3e3e; font-weight: bold; margin: 20px; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>Crash Radar</h1>
    <div id="radarDisplay">1.00</div>
    <button onclick="startGame()">ابدأ الرادار</button>

    <script>
        function startGame() {
            let num = 1.00;
            let crashPoint = (Math.random() * (30 - 1) + 1).toFixed(2); // رقم عشوائي للانفجار
            let display = document.getElementById("radarDisplay");
            
            let game = setInterval(() => {
                num += 0.05; // سرعة العداد
                display.innerText = num.toFixed(2);

                if (num >= crashPoint) {
                    clearInterval(game);
                    display.innerText = "BOOM! " + crashPoint;
                    display.style.color = "red";
                }
            }, 100);
        }
    </script>
</body>
</html>
