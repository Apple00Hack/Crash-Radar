<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكريبت كاشف منجم الذهب 🔓</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            background: #1e1e2f;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 2px solid #00ffcc;
        }

        h1 {
            color: #00ffcc;
            margin-bottom: 10px;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }

        .menu select, .btn {
            background: #252538;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 0;
            font-weight: bold;
            width: 100%;
        }

        .btn {
            background: #00ffcc;
            color: #0f172a;
            transition: 0.3s;
        }

        .btn:hover {
            background: #00b386;
            box-shadow: 0 0 15px rgba(0,255,204,0.8);
        }

        .game-area {
            display: none;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            background: #252538;
            color: #00ffcc;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            border: 1px solid #00ffcc;
        }

        /* لوحة الكاشف (الخطوات) */
        .ladder {
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            margin-bottom: 15px;
        }

        .row-level {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .box {
            background: #2b2b40;
            border: 2px solid #444;
            border-radius: 6px;
            height: 45px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #888;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .box.active {
            border-color: #00ffcc;
            color: #fff;
            background: #1a1a2e;
            box-shadow: 0 0 8px rgba(0,255,204,0.4);
        }

        .box.revealed-gold {
            background: #1b4332 !important;
            border-color: #52b788 !important;
            color: #52b788 !important;
        }

        .box.revealed-bomb {
            background: #4a1515 !important;
            border-color: #e63946 !important;
            color: #e63946 !important;
        }

        #message {
            font-size: 15px;
            font-weight: bold;
            margin: 10px 0;
            min-height: 25px;
            color: #ffcc00;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصفحة الأولى: سكريبت الهكر والكاشف -->
        <div class="menu" id="mainMenu">
            <h1>🛡️ سكريبت كاشف المنجم 🔓</h1>
            <p style="color: #aaa; margin-bottom: 15px; font-size: 13px;">اختر وضع اللعبة لتفعيل السكريبت وكشف مسار الذهب</p>
            
            <div style="margin-bottom: 15px; text-align: right;">
                <label style="color: #00ffcc; font-size: 14px; font-weight: bold;">حدد الوضع:</label>
                <select id="gameMode" style="margin-top: 5px;">
                    <option value="2">مستوى 2x (خيارين)</option>
                    <option value="3">مستوى 3x (3 خيارات)</option>
                </select>
            </div>

            <button class="btn" onclick="initGame()">تفعيل السكريبت وبدء الكشف ⚡</button>
        </div>

        <!-- الصفحة الثانية: شاشة الكاشف الحية -->
        <div class="game-area" id="gameArea">
            <div class="header-info">
                <div>الحالة: <span style="color: #00ffcc;">متصل بالمتعقب 🟢</span></div>
                <div>الخطوة: <span id="currentStepText">1</span> / 6</div>
            </div>

            <!-- سلم الكشف -->
            <div class="ladder" id="ladderContainer"></div>

            <div id="message">اضغط على الخطوة الحالية لكشف مكان الذهب!</div>

            <button id="nextSignalBtn" class="btn hidden" onclick="nextSignal()" style="margin-bottom: 5px;">إرسال إشارة جديدة 🔄</button>
            <button class="btn" style="background: #333; color: #fff; border: 1px solid #555; font-size: 14px; padding: 8px;" onclick="resetToMenu()">إيقاف السكريبت والقائمة الرئيسية</button>
        </div>
    </div>

    <script>
        let mode = 2; 
        let currentStep = 0;
        const totalSteps = 6; 
        let winningPaths = []; 

        function initGame() {
            mode = parseInt(document.getElementById('gameMode').value);
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            
            resetGameVariables();
            buildLadder();
        }

        function resetGameVariables() {
            currentStep = 0;
            winningPaths = [];
            document.getElementById('nextSignalBtn').classList.add('hidden');
            document.getElementById('message').innerText = "السكريبت جاهز.. اضغط على الخطوة الحالية لكشف الذهب!";

            for (let i = 0; i < totalSteps; i++) {
                winningPaths.push(Math.floor(Math.random() * mode));
            }
        }

        function buildLadder() {
            const ladder = document.getElementById('ladderContainer');
            ladder.innerHTML = "";

            for (let i = totalSteps - 1; i >= 0; i--) {
                const row = document.createElement('div');
                row.className = 'row-level';
                row.id = `row-${i}`;

                for (let j = 0; j < mode; j++) {
                    const box = document.createElement('div');
                    box.className = `box ${i === currentStep ? 'active' : ''}`;
                    box.innerText = i === currentStep ? "🔍 اكشف" : "🔒 مغلق";
                    box.dataset.step = i;
                    box.dataset.index = j;
                    
                    // الضغط يكشف محتوى هذه الخطوة بالكامل عبر السكريبت
                    box.onclick = () => revealStep(i);
                    row.appendChild(box);
                }
                ladder.appendChild(row);
            }
            document.getElementById('currentStepText').innerText = currentStep + 1;
        }

        function revealStep(step) {
            if (step !== currentStep) return;

            const correctIndex = winningPaths[step];
            const row = document.getElementById(`row-${step}`);
            const boxes = row.children;

            // كشف الخانات (إظهار الذهب والديناميت للخطوة الحالية)
            for (let j = 0; j < boxes.length; j++) {
                boxes[j].onclick = null;
                if (j === correctIndex) {
                    boxes[j].innerHTML = "🪙 ذهب";
                    boxes[j].className = "box revealed-gold";
                } else {
                    boxes[j].innerHTML = "🧨 ديناميت";
                    boxes[j].className = "box revealed-bomb";
                }
            }

            currentStep++;
            if (currentStep < totalSteps) {
                document.getElementById('message').innerText = "تم كشف هذه الخطوة بنجاح! انتقل للخطوة التالية ⚡";
                activateCurrentStep();
            } else {
                document.getElementById('message').innerText = "تم كشف جميع خطوات المنجم للنهاية بنجاح! 🏆";
                document.getElementById('nextSignalBtn').classList.remove('hidden');
            }
            document.getElementById('currentStepText').innerText = Math.min(currentStep + 1, totalSteps);
        }

        function activateCurrentStep() {
            if (currentStep < totalSteps) {
                const row = document.getElementById(`row-${currentStep}`);
                if (row) {
                    for (let box of row.children) {
                        box.className = "box active";
                        box.innerText = "🔍 اكشف";
                        box.onclick = () => revealStep(currentStep);
                    }
                }
            }
        }

        function nextSignal() {
            resetGameVariables();
            buildLadder();
        }

        function resetToMenu() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
        }
    </script>
</body>
</html>
